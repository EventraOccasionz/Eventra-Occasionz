<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login - Eventra Occasionz</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h1><i class="fas fa-user-shield"></i> Admin Login</h1>
                <p>Eventra Occasionz Dashboard</p>
            </div>
            <form id="adminLoginForm" class="admin-form">
                <div class="form-group">
                    <label for="adminEmail"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="adminEmail" name="email" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="admin-btn" id="loginBtn">
                    <span>Login</span>
                    <i class="fas fa-sign-in-alt"></i>
                </button>
                <div id="loginError" class="error-message"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const form = document.getElementById('adminLoginForm');
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>Logging in...</span><i class="fas fa-spinner fa-spin"></i>';
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // Check if user is admin in Firestore
                const adminDoc = await getDoc(doc(db, 'admins', userCredential.user.uid));
                
                if (adminDoc.exists()) {
                    // Store session
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    sessionStorage.setItem('adminEmail', email);
                    
                    // Redirect to dashboard
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.textContent = 'Access denied. You are not an admin.';
                    await auth.signOut();
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Login failed. Please check your credentials.';
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Login</span><i class="fas fa-sign-in-alt"></i>';
            }
        });
    </script>
</body>
</html>
